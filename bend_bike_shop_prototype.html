<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bend Bike Shop | Rental Prototype</title>
<style>
:root{--ink:#15251f;--muted:#68756f;--paper:#f6f7f2;--card:#fff;--green:#1e684d;--green2:#dcece3;--lime:#c8e56b;--line:#dce2dc;--red:#a93b34;--redbg:#fbe8e5;--gold:#8a6117;--goldbg:#fff2d5;--shadow:0 12px 35px #18392a12}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #94bb47;outline-offset:2px}.topbar{background:#14251e;color:#fff;padding:14px clamp(16px,4vw,56px);display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.4px}.brandmark{width:38px;height:38px;background:var(--lime);border-radius:12px;display:grid;place-items:center;color:#183a2b;font-size:21px}.brand small{display:block;color:#b6c7bc;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.nav button{padding:9px 13px;background:transparent;color:#d7e2db;border-radius:9px;font-weight:650}.nav button.active,.nav button:hover{background:#2c473a;color:white}.mode-switch{display:flex;gap:4px;padding:4px;background:#0c1813;border:1px solid #30453a;border-radius:12px}.mode-switch button{background:transparent;color:#b8c8bf;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:750}.mode-switch button.active{background:var(--lime);color:#193326}.shell{max-width:1240px;margin:auto;padding:28px clamp(16px,4vw,48px) 60px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--green);font-weight:850}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:10px 0 25px}.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-1.5px;margin:5px 0 9px}.hero p{margin:0;color:var(--muted);max-width:650px}.btn{border-radius:10px;padding:10px 15px;font-weight:750;transition:transform .12s,background .12s}.btn:active{transform:translateY(1px)}.primary{background:var(--green);color:white}.primary:hover{background:#164e39}.secondary{background:#edf2ed;color:var(--ink);border:1px solid var(--line)}.secondary:hover{background:#e1e9e2}.danger{background:var(--redbg);color:var(--red)}.lime{background:var(--lime);color:#193326}.small{font-size:13px;padding:7px 10px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.pad{padding:21px}.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat{padding:18px}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:29px;letter-spacing:-1px;margin-top:3px}.stat em{font-size:12px;color:var(--green);font-style:normal;font-weight:700}.two-col{grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-title h2{font-size:19px;margin:0;letter-spacing:-.4px}.muted{color:var(--muted)}.bike-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.bike{overflow:hidden}.bike-art{height:145px;background:linear-gradient(145deg,#e2eee5,#f4f5e9);display:grid;place-items:center;font-size:76px;position:relative}.bike-art:after{content:"";position:absolute;width:120px;height:12px;border-radius:50%;background:#163f2b15;bottom:14px;filter:blur(5px)}.bike-body{padding:16px}.bike-body h3{margin:0 0 3px;font-size:17px}.price{font-size:20px;font-weight:850;margin:12px 0}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 8px;background:var(--green2);color:var(--green);font-size:11px;font-weight:800}.tag.off{background:var(--redbg);color:var(--red)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;flex:1;min-width:130px}.field label{font-size:12px;font-weight:800;color:#46564d}.field input,.field select{border:1px solid #cfd9d0;border-radius:9px;padding:10px 11px;background:white;color:var(--ink);width:100%}.formrow{display:flex;gap:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf0eb;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);background:#fafbf8}td strong{font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{padding:12px 14px;border-radius:11px;margin:12px 0;background:var(--green2);color:var(--green);font-weight:650;font-size:13px}.notice.error{background:var(--redbg);color:var(--red)}.notice.warn{background:var(--goldbg);color:var(--gold)}.hidden{display:none!important}.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-radius:12px;background:var(--green2);color:var(--green);margin-bottom:10px;font-weight:700}.banner.red{background:var(--redbg);color:var(--red)}.banner.gold{background:var(--goldbg);color:var(--gold)}.linkbtn{background:none;color:var(--green);font-weight:800;padding:5px}.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.page-head h2{margin:0;font-size:23px;letter-spacing:-.6px}.subnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.subnav button{background:#e9eee8;color:#4b5a50;padding:8px 12px;border-radius:9px;font-weight:750;font-size:13px}.subnav button.active{background:var(--green);color:#fff}.empty{text-align:center;padding:35px;color:var(--muted)}.customer-summary{background:#18392b;color:white;border-radius:16px;padding:20px}.customer-summary strong{font-size:28px;display:block}.customer-summary p{color:#c3d3c8;margin:5px 0 0}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 12px;background:white;color:var(--ink)}.footer{border-top:1px solid var(--line);padding-top:18px;margin-top:34px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.toast{position:fixed;bottom:20px;right:20px;background:#14251e;color:white;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:20;max-width:min(400px,calc(100vw - 40px));animation:appear .2s ease}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bike-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.topbar{flex-wrap:wrap}.nav{order:3;width:100%}.hero{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.bike-grid{grid-template-columns:1fr}.formrow{flex-direction:column;gap:0}.stats{gap:10px}.stat strong{font-size:24px}.topbar{padding:12px 15px}.shell{padding-top:20px}.mode-switch{margin-left:auto}.nav button{padding:8px 9px;font-size:12px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brandmark">✳</div><div>BEND BIKE SHOP<small>Ride a little farther</small></div></div>
  <nav class="nav" id="mainNav" aria-label="Main navigation"></nav>
  <div class="mode-switch" aria-label="Switch experience"><button id="customerMode" class="active" onclick="setMode('customer')">Customer</button><button id="employeeMode" onclick="setMode('employee')">Employee</button></div>
</header>
<main class="shell" id="app"></main>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const initialBikes=[
{id:'BB-101',name:'Cascade Shredder',type:'Mountain',size:'M',price:18,status:'available',notes:'Trail-ready hardtail'},
{id:'BB-102',name:'Cascade Shredder',type:'Mountain',size:'L',price:18,status:'available',notes:'Freshly tuned'},
{id:'BB-103',name:'Summit Roadster',type:'Road',size:'M',price:20,status:'available',notes:'Lightweight frame'},
{id:'BB-104',name:'Summit Roadster',type:'Road',size:'L',price:20,status:'service',notes:'Rear brake inspection'},
{id:'BB-105',name:'River Runner',type:'Hybrid',size:'M',price:15,status:'available',notes:'Comfortable city ride'},
{id:'BB-106',name:'River Runner',type:'Hybrid',size:'S',price:15,status:'reserved',notes:'Reservation pickup today'}
];
let bikes=initialBikes.map(x=>({...x}));let reservations=[{id:'R-2041',customer:'Marvin McBride',phone:'541-555-0182',bikeId:'BB-106',date:todayPlus(0),hours:4,status:'Reserved',charge:15,fees:0},{id:'R-2042',customer:'Sarah Smith',phone:'541-555-0144',bikeId:'BB-101',date:todayPlus(0),hours:4,status:'Out',charge:18,fees:5},{id:'R-2043',customer:'Alex Johnson',phone:'541-555-0199',bikeId:'BB-103',date:todayPlus(1),hours:8,status:'Reserved',charge:40,fees:0}];
let customers=[{name:'Marvin McBride',phone:'541-555-0182',rentals:4,charges:0},{name:'Sarah Smith',phone:'541-555-0144',rentals:2,charges:5},{name:'Alex Johnson',phone:'541-555-0199',rentals:1,charges:0},{name:'Emily Carter',phone:'541-555-0131',rentals:3,charges:0}];
let employees=[{name:'Wheely Tyred',role:'Employee'},{name:'Casey Spokes',role:'Manager'},{name:'Rodney Ridealot',role:'Owner'}];
let mode='customer',page='home',notice='',selectedCustomer='Sarah Smith',activeCustomerSub='list',selectedReport='business',nextReservation=2050;
function todayPlus(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function money(n){return '$'+Number(n).toFixed(2)}
function bikeById(id){return bikes.find(b=>b.id===id)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2800)}
function setMode(m){mode=m;page=m==='customer'?'home':'dashboard';notice='';render()}
function go(p){page=p;notice='';render()}
function setNotice(msg,type='ok'){notice={msg,type};render()}
function noticeHTML(){if(!notice)return '';if(typeof notice==='string')return `<div class="notice">${esc(notice)}</div>`;return `<div class="notice ${notice.type==='error'?'error':notice.type==='warn'?'warn':''}">${esc(notice.msg)}</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function navItems(){return mode==='customer'?[['home','Rent a bike'],['myreservations','My reservations']]:[['dashboard','Dashboard'],['customers','Customers & charges'],['inventory','Inventory'],['reports','Reports'],['permissions','Employee permissions']]}
function renderNav(){document.getElementById('mainNav').innerHTML=navItems().map(([p,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${l}</button>`).join('');document.getElementById('customerMode').classList.toggle('active',mode==='customer');document.getElementById('employeeMode').classList.toggle('active',mode==='employee')}
function render(){renderNav();let root=document.getElementById('app');const views={home:customerHome,myreservations:myReservations,dashboard:dashboard,customers:customerList,charges:charges,inventory:inventory,reports:reports,permissions:permissions};root.innerHTML=(views[page]||customerHome)();wireForms();}
function hero(kicker,title,desc,action=''){return `<div class="hero"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stats(items){return `<div class="grid stats">${items.map(([label,value,foot])=>`<div class="card stat"><span>${label}</span><strong>${value}</strong><em>${foot}</em></div>`).join('')}</div>`}
function customerHome(){let available=bikes.filter(b=>b.status==='available');return `${hero('YOUR NEXT RIDE STARTS HERE','Find your kind of outside.','Choose a bike, pick your date, and we’ll have it ready at the counter.','<button class="btn secondary" onclick="go(\'myreservations\')">View reservations ↗</button>')}${noticeHTML()}<div class="card pad" style="margin-bottom:20px"><div class="section-title"><h2>Find your ride</h2><span class="muted" style="font-size:13px">Rentals in 4-hour increments · up to 7 days</span></div><div class="formrow"><div class="field"><label for="rentDate">Pickup date</label><input id="rentDate" type="date" min="${todayPlus(0)}" value="${todayPlus(0)}"></div><div class="field"><label for="rentType">Bike type</label><select id="rentType"><option value="All">All types</option><option>Mountain</option><option>Road</option><option>Hybrid</option></select></div><div class="field"><label for="rentSize">Rider / frame size</label><select id="rentSize"><option value="All">Any size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select></div><div style="display:flex;align-items:flex-end;padding-bottom:13px"><button class="btn primary" onclick="filterBikes()">Find bikes</button></div></div><div id="filterNotice" class="muted" style="font-size:12px">Showing currently rentable bikes. Choose a date and filters to narrow your search.</div></div><div class="section-title"><h2>Popular bikes</h2><span class="muted">${available.length} currently available</span></div><div class="grid bike-grid" id="bikeGrid">${bikeCards(available)}</div><div class="footer"><span>✓ Secure payment authorization</span><span>Helmets available free on request</span><span>Bike pickup and return with an employee</span></div>`}
function bikeCards(list){if(!list.length)return '<div class="card empty" style="grid-column:1/-1">No bikes match those filters. Try another date, type, or size.</div>';return list.map((b,i)=>`<article class="card bike"><div class="bike-art">${b.type==='Mountain'?'🚵':b.type==='Road'?'🚴':'🚲'}</div><div class="bike-body"><div class="toolbar" style="justify-content:space-between"><span class="tag">${b.type}</span><span class="muted" style="font-size:12px">Size ${b.size}</span></div><h3 style="margin-top:10px">${esc(b.name)}</h3><div class="muted" style="font-size:13px">${esc(b.notes||'Ready for your next ride')}</div><div class="price">${money(b.price)} <span class="muted" style="font-size:12px;font-weight:500">/ 4 hours</span></div><button class="btn primary" style="width:100%" onclick="startReservation('${b.id}')">Reserve this bike</button></div></article>`).join('')}
function filterBikes(){const type=document.getElementById('rentType').value,size=document.getElementById('rentSize').value,date=document.getElementById('rentDate').value;if(!date){toast('Choose a pickup date first.');return}const list=bikes.filter(b=>(b.status==='available'||(date>todayPlus(0)&&b.status==='service'))&&(type==='All'||b.type===type)&&(size==='All'||b.size===size));document.getElementById('bikeGrid').innerHTML=bikeCards(list);document.getElementById('filterNotice').textContent=`${list.length} matching bike${list.length===1?'':'s'} for ${date}. Bikes currently in service are assumed available the next day.`}
function startReservation(id){let b=bikeById(id);let date=document.getElementById('rentDate')?.value||todayPlus(0);if(!b||!(b.status==='available'||(b.status==='service'&&date>todayPlus(0)))){toast('That bike is no longer available. Please choose another.');return}document.getElementById('app').insertAdjacentHTML('afterbegin',`<div id="reserveOverlay" style="position:fixed;inset:0;background:#10221999;z-index:10;display:grid;place-items:center;padding:18px"><form class="card pad" style="width:min(560px,100%);max-height:90vh;overflow:auto" onsubmit="submitReservation(event,'${b.id}')"><div class="page-head"><div><div class="eyebrow">RESERVATION</div><h2>Reserve ${esc(b.name)}</h2></div><button type="button" class="btn secondary small" onclick="closeReservation()">Close ✕</button></div><p class="muted">${esc(b.type)} bike · Size ${b.size} · ${money(b.price)} per 4 hours</p><div class="formrow"><div class="field"><label>Your name</label><input name="customer" required placeholder="Full name"></div><div class="field"><label>Phone number</label><input name="phone" required type="tel" placeholder="541-555-0123"></div></div><div class="formrow"><div class="field"><label>Pickup date</label><input name="date" type="date" min="${todayPlus(0)}" value="${date}" required></div><div class="field"><label>Rental duration</label><select name="hours"><option value="4">4 hours</option><option value="8">8 hours</option><option value="12">1 day (12 billable hours)</option><option value="24">2 days</option><option value="48">4 days</option><option value="84">7 days</option></select></div></div><div class="field"><label>Payment card (demo)</label><input name="card" inputmode="numeric" minlength="12" maxlength="19" placeholder="4242 4242 4242 4242" required></div><label style="display:flex;gap:9px;align-items:flex-start;font-size:13px;margin:12px 0"><input type="checkbox" required style="margin-top:4px"> I agree to complete the shop's rental waiver before pickup.</label><div class="notice warn">Demo prototype: payment authorization is simulated. No real card data is sent or stored.</div><button class="btn primary" type="submit" style="width:100%">Confirm reservation · ${money(b.price)}</button></form></div>`)}
function closeReservation(){document.getElementById('reserveOverlay')?.remove()}
function submitReservation(e,id){e.preventDefault();const f=new FormData(e.target),b=bikeById(id);if(!b||!(b.status==='available'||(b.status==='service'&&f.get('date')>todayPlus(0)))){toast('Sorry, this bike was just booked.');closeReservation();return}const hours=Number(f.get('hours')),count=hours===12?1:hours/12;const charge=b.price*(hours/4);const r={id:'R-'+nextReservation++,customer:f.get('customer').trim(),phone:f.get('phone').trim(),bikeId:id,date:f.get('date'),hours,status:'Reserved',charge,fees:0};reservations.push(r);if(r.date===todayPlus(0))b.status='reserved';let c=customers.find(c=>c.name.toLowerCase()===r.customer.toLowerCase());if(!c){c={name:r.customer,phone:r.phone,rentals:0,charges:0};customers.push(c)}c.rentals++;closeReservation();page='myreservations';notice={msg:`Reservation ${r.id} confirmed. Your card authorization passed (demo).`,type:'ok'};render()}
function myReservations(){return `${hero('YOUR RIDES','My reservations','Look up your reservations and see what’s coming up.','<button class="btn secondary" onclick="go(\'home\')">← Browse bikes</button>')}${noticeHTML()}<div class="card pad"><div class="section-title"><h2>Reservation history</h2><span class="tag">Guest-friendly</span></div><div class="field" style="max-width:400px"><label for="lookupPhone">Phone number</label><div class="toolbar"><input id="lookupPhone" class="pill" style="flex:1;min-width:180px" placeholder="Enter phone number"><button class="btn secondary" onclick="lookupReservations()">Look up</button></div></div><div id="myReservationResults">${reservationTable(reservations)}</div></div>`}
function lookupReservations(){const p=document.getElementById('lookupPhone').value.trim();if(!p){toast('Enter a phone number to look up reservations.');return}let rs=reservations.filter(r=>r.phone===p);document.getElementById('myReservationResults').innerHTML=rs.length?reservationTable(rs):'<div class="empty">No reservations found for that phone number.</div>'}
function reservationTable(rs){return `<div class="table-wrap"><table><thead><tr><th>Reservation</th><th>Customer</th><th>Bike</th><th>Pickup</th><th>Status</th><th>Estimate</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr><td><strong>${r.id}</strong></td><td>${esc(r.customer)}</td><td>${esc(bikeById(r.bikeId)?.name||r.bikeId)}</td><td>${r.date}</td><td><span class="tag ${r.status==='Cancelled'?'off':''}">${r.status}</span></td><td>${money(r.charge+r.fees)}</td><td>${r.status==='Reserved'?`<button class="btn danger small" onclick="cancelReservation('${r.id}')">Cancel</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function cancelReservation(id){let r=reservations.find(x=>x.id===id);if(!r||r.status!=='Reserved'){toast('Only upcoming reservations can be cancelled here.');return}if(!confirm(`Cancel reservation ${id}? A cancellation fee may apply.`))return;r.status='Cancelled';let b=bikeById(r.bikeId);if(b&&b.status==='reserved')b.status='available';notice={msg:`Reservation ${id} cancelled. Cancellation fee policy applied by the shop.`,type:'warn'};render()}
function dashboard(){let available=bikes.filter(b=>b.status==='available').length,service=bikes.filter(b=>b.status==='service').length,out=reservations.filter(r=>r.status==='Out').length;return `${hero('STAFF WORKSPACE','Good to see you, team.','A live snapshot of rentals, bikes, and shop activity.','<button class="btn primary" onclick="go(\'inventory\')">Manage inventory +</button>')}${noticeHTML()}${stats([['Bikes available',available,'Ready to reserve'],['Currently out',out,'Active rentals'],['In service',service,'Unavailable to rent'],['Reservations',reservations.filter(r=>r.status==='Reserved').length,'Upcoming / awaiting pickup']])}<div class="grid two-col"><section class="card pad"><div class="section-title"><h2>Today’s rental activity</h2><button class="linkbtn" onclick="go('customers')">View customers →</button></div>${reservationTable(reservations.filter(r=>r.date===todayPlus(0)))}</section><section class="card pad"><div class="section-title"><h2>Quick actions</h2></div><div class="grid" style="gap:10px"><button class="btn secondary" onclick="go('customers')">👥 Customer list & charges</button><button class="btn secondary" onclick="go('inventory')">🚲 Update bike availability</button><button class="btn secondary" onclick="go('reports')">📊 View business reports</button><button class="btn secondary" onclick="go('permissions')">🔐 Employee permissions</button></div><div class="notice" style="margin-top:17px">Remember: bike handoffs and returns are completed by an employee at the counter.</div></section></div>`}
function customerList(){return `${hero('EMPLOYEE TOOLS','Customer list','Find a customer and manage rental charges or exceptions.','<button class="btn secondary" onclick="go(\'dashboard\')">← Dashboard</button>')}${noticeHTML()}<div class="card pad"><div class="section-title"><h2>Customers</h2><div class="toolbar"><input id="customerSearch" class="pill" placeholder="Search name or phone" oninput="filterCustomers()"><button class="btn primary" onclick="addCustomer()">+ Add customer</button></div></div><div id="customerTable">${customersTable(customers)}</div></div>`}
function customersTable(list){return `<div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Rentals</th><th>Outstanding charges</th><th>Action</th></tr></thead><tbody>${list.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone)}</td><td>${c.rentals}</td><td>${money(c.charges)}</td><td><button class="btn secondary small" onclick="openCharges('${esc(c.name)}')">Manage charges →</button></td></tr>`).join('')}</tbody></table></div>`}
function filterCustomers(){const q=document.getElementById('customerSearch').value.toLowerCase();document.getElementById('customerTable').innerHTML=customersTable(customers.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q)))}
function addCustomer(){document.getElementById('app').insertAdjacentHTML('afterbegin',`<div id="customerOverlay" style="position:fixed;inset:0;background:#10221999;z-index:10;display:grid;place-items:center;padding:18px"><form class="card pad" style="width:min(450px,100%)" onsubmit="saveCustomer(event)"><div class="page-head"><h2>Add customer</h2><button type="button" class="btn secondary small" onclick="document.getElementById('customerOverlay').remove()">Close ✕</button></div><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone" type="tel" required></div><button class="btn primary" type="submit">Save customer</button></form></div>`)}
function saveCustomer(e){e.preventDefault();let f=new FormData(e.target);if(customers.some(c=>c.phone===f.get('phone'))){toast('A customer with that phone already exists.');return}customers.push({name:f.get('name'),phone:f.get('phone'),rentals:0,charges:0});document.getElementById('customerOverlay').remove();toast('Customer added.');render()}
function openCharges(name){selectedCustomer=name;page='charges';activeCustomerSub='charges';render()}
function charges(){const c=customers.find(c=>c.name===selectedCustomer)||customers[0];const rs=reservations.filter(r=>r.customer===c.name);return `${hero('CUSTOMER MANAGEMENT','Customer charges','Review charges and apply an adjustment with a clear audit trail.','<button class="btn secondary" onclick="go(\'customers\')">← Customer list</button>')}${noticeHTML()}<div class="subnav"><button class="active" onclick="go('customers')">Customer list page</button><button class="active">Customer charges screen</button></div><div class="grid two-col"><section class="card pad"><div class="section-title"><h2>${esc(c.name)}</h2><span class="tag">Customer record</span></div><p class="muted">${esc(c.phone)} · ${c.rentals} previous rentals</p><div class="customer-summary"><span>Outstanding / adjusted charges</span><strong>${money(c.charges)}</strong><p>Changes here are saved in this prototype session.</p></div><div style="margin-top:20px"><h3 style="font-size:15px">Rental history</h3>${rs.length?reservationTable(rs):'<div class="empty">No reservations recorded for this customer.</div>'}</div></section><section class="card pad"><div class="section-title"><h2>Adjust charges</h2></div><p class="muted" style="font-size:13px">Choose an action to apply a fee or cancel existing charges. The confirmation banner appears below.</p><div class="field"><label for="feeAmount">Amount ($)</label><input id="feeAmount" type="number" min="0.01" step="0.01" value="5.00"></div><div class="field"><label for="feeReason">Reason / staff note</label><input id="feeReason" placeholder="e.g. Late return, lost bike"></div><div class="grid" style="gap:10px"><button class="btn primary" onclick="applyCharge('late')">＋ Add late fee</button><button class="btn primary" onclick="applyCharge('replacement')">＋ Add replacement fee</button><button class="btn danger" onclick="applyCharge('cancel')">Cancel charges</button></div><div id="chargeBanners" style="margin-top:18px">${notice&&notice.msg?`<div class="banner">${esc(notice.msg)}</div>`:''}</div></section></div>`}
function applyCharge(type){const c=customers.find(c=>c.name===selectedCustomer);if(!c)return;let amount=Number(document.getElementById('feeAmount').value);let reason=document.getElementById('feeReason').value.trim();if(type!=='cancel'&&(!Number.isFinite(amount)||amount<=0)){toast('Enter an amount greater than zero.');return}let message='';if(type==='late'){c.charges+=amount;message=`Added late fee of ${money(amount)}${reason?' · '+reason:''}.`}else if(type==='replacement'){c.charges+=amount;message=`Added replacement fee of ${money(amount)}${reason?' · '+reason:''}.`}else{if(c.charges<=0){toast('There are no outstanding charges to cancel.');return}if(!confirm(`Cancel all ${money(c.charges)} in charges for ${c.name}?`))return;message=`Cancelled ${money(c.charges)} in charges${reason?' · '+reason:''}.`;c.charges=0}notice={msg:message,type:type==='cancel'?'warn':'ok'};render();toast(message)}
function inventory(){return `${hero('FLEET MANAGEMENT','Inventory','Keep availability accurate across the website and kiosk. Bikes in service are hidden from same-day reservations.','<button class="btn primary" onclick="showAddBike()">+ Register bikes</button>')}${noticeHTML()}<div class="subnav"><button class="active">Inventory page</button><button onclick="go('reports')">Inventory reports →</button></div><div class="grid stats">${stats([['Total bikes',bikes.length,'Registered in fleet'],['Available',bikes.filter(b=>b.status==='available').length,'Can be reserved'],['Reserved',bikes.filter(b=>b.status==='reserved').length,'Awaiting pickup'],['Out for service',bikes.filter(b=>b.status==='service').length,'Not available today']]).replace('<div class="grid stats">','').replace(/<\/div>$/,'')}</div><div class="card pad"><div class="section-title"><h2>Bike inventory</h2><span class="muted" style="font-size:13px">${bikes.length} bikes registered</span></div><div class="table-wrap"><table><thead><tr><th>Bike ID</th><th>Model</th><th>Type / size</th><th>Rate / 4h</th><th>Status</th><th>Staff notes</th><th>Actions</th></tr></thead><tbody>${bikes.map(b=>`<tr><td><strong>${b.id}</strong></td><td>${esc(b.name)}</td><td>${b.type} / ${b.size}</td><td>${money(b.price)}</td><td><span class="tag ${b.status==='service'?'off':b.status==='reserved'?'':' '}">${b.status==='service'?'In service':b.status==='reserved'?'Reserved':'Available'}</span></td><td>${esc(b.notes||'—')}</td><td><div class="actions">${b.status==='available'?`<button class="btn danger small" onclick="setBikeStatus('${b.id}','service')">Mark unavailable</button>`:b.status==='service'?`<button class="btn primary small" onclick="setBikeStatus('${b.id}','available')">List available</button>`:`<button class="btn secondary small" onclick="setBikeStatus('${b.id}','available')">Release</button>`}<button class="btn secondary small" onclick="editBikeNotes('${b.id}')">Notes</button></div></td></tr>`).join('')}</tbody></table></div></div><div id="bikeOverlayHost"></div>`}
function setBikeStatus(id,status){let b=bikeById(id);if(!b)return;if(status==='available'&&!confirm(`Mark ${b.id} as available for rental?`))return;b.status=status;notice={msg:`${b.id} marked ${status==='service'?'unavailable / in service':'available'}. Customer availability has been updated.`,type:'ok'};render()}
function showAddBike(){document.getElementById('bikeOverlayHost')?.remove();document.getElementById('app').insertAdjacentHTML('beforeend',`<div id="bikeOverlay" style="position:fixed;inset:0;background:#10221999;z-index:10;display:grid;place-items:center;padding:18px"><form class="card pad" style="width:min(550px,100%);max-height:90vh;overflow:auto" onsubmit="addBike(event)"><div class="page-head"><h2>Register new bike</h2><button type="button" class="btn secondary small" onclick="document.getElementById('bikeOverlay').remove()">Close ✕</button></div><div class="formrow"><div class="field"><label>Model</label><input name="name" required placeholder="e.g. River Runner"></div><div class="field"><label>Type</label><select name="type"><option>Mountain</option><option>Road</option><option>Hybrid</option></select></div></div><div class="formrow"><div class="field"><label>Frame size</label><select name="size"><option>S</option><option selected>M</option><option>L</option><option>XL</option></select></div><div class="field"><label>Rate per 4 hours ($)</label><input name="price" type="number" min="1" step="0.5" value="18" required></div><div class="field"><label>Quantity</label><input name="qty" type="number" min="1" max="30" value="1" required></div></div><div class="field"><label>Notes (optional)</label><input name="notes" placeholder="Serial number, setup, service notes"></div><button class="btn primary" type="submit">Register bikes</button></form></div>`)}
function addBike(e){e.preventDefault();let f=new FormData(e.target),qty=Number(f.get('qty'));for(let i=0;i<qty;i++){let num=Math.max(100,...bikes.map(b=>Number(b.id.split('-')[1])||0))+1;bikes.push({id:'BB-'+num,name:f.get('name'),type:f.get('type'),size:f.get('size'),price:Number(f.get('price')),status:'available',notes:f.get('notes')||'Newly registered'})}document.getElementById('bikeOverlay').remove();notice={msg:`${qty} bike${qty===1?'':'s'} registered and available across the website and kiosk.`,type:'ok'};render()}
function editBikeNotes(id){let b=bikeById(id),notes=prompt(`Update staff notes for ${id}:`,b.notes||'');if(notes===null)return;b.notes=notes;notice={msg:`Staff notes updated for ${id}.`,type:'ok'};render()}
function reports(){let income=reservations.filter(r=>r.status==='Returned').reduce((s,r)=>s+r.charge+r.fees,0),typeCounts=['Mountain','Road','Hybrid'].map(t=>[t,reservations.filter(r=>bikeById(r.bikeId)?.type===t).length]);return `${hero('INSIGHTS','Business reports','Explore current activity and inventory performance.','<button class="btn secondary" onclick="go(\'dashboard\')">← Dashboard</button>')}${noticeHTML()}<div class="subnav"><button class="${selectedReport==='business'?'active':''}" onclick="selectReport('business')">Business reports</button><button class="${selectedReport==='inventory'?'active':''}" onclick="selectReport('inventory')">Inventory reports</button></div>${stats([['Total reservations',reservations.length,'All recorded bookings'],['Rental value',money(reservations.reduce((s,r)=>s+r.charge,0)),'Before adjustments'],['Available bikes',bikes.filter(b=>b.status==='available').length,'Live inventory'],['Service rate',Math.round(bikes.filter(b=>b.status==='service').length/Math.max(1,bikes.length)*100)+'%','Fleet currently in service']])}<div class="grid two-col"><section class="card pad"><div class="section-title"><h2>${selectedReport==='business'?'Rental activity':'Inventory status'}</h2><span class="tag">Live dashboard</span></div><div style="display:flex;align-items:flex-end;gap:12px;height:190px;padding:10px 5px 0;border-bottom:1px solid var(--line)">${(selectedReport==='business'?[reservations.length*12+22,Math.max(20,reservations.filter(r=>r.status==='Returned').length*20+15),reservations.filter(r=>r.status==='Reserved').length*20+20,Math.max(15,reservations.filter(r=>r.status==='Out').length*25+10)]:[bikes.filter(b=>b.status==='available').length,bikes.filter(b=>b.status==='reserved').length,bikes.filter(b=>b.status==='service').length]).map((v,i,arr)=>`<div style="flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:7px"><strong style="font-size:12px">${v}</strong><div style="height:${Math.max(7,Math.min(140,v/Math.max(...arr,1)*140))}px;background:${selectedReport==='inventory'&&i===2?'#e5a29a':'#78a985'};border-radius:7px 7px 0 0"></div><span class="muted" style="font-size:11px">${(selectedReport==='business'?['Bookings','Returned','Reserved','Out']:['Available','Reserved','Service'])[i]}</span></div>`).join('')}</div><p class="muted" style="font-size:12px">Prototype sample visualization based on the current session data.</p></section><section class="card pad"><div class="section-title"><h2>Report options</h2></div><div class="field"><label>Reporting period</label><select id="reportPeriod"><option>Current snapshot</option><option>This week</option><option>This month</option><option>This year</option></select></div><div class="field"><label>Break down by</label><select id="reportBreakdown"><option>Bike type</option><option>Reservation status</option><option>Availability status</option></select></div><button class="btn primary" onclick="generateReport()">Generate report</button><button class="btn secondary" style="margin-left:6px" onclick="exportReport()">Export CSV</button><div id="reportOutput" style="margin-top:14px"></div></section></div>`}
function selectReport(type){selectedReport=type;page='reports';render()}
function generateReport(){const period=document.getElementById('reportPeriod').value,by=document.getElementById('reportBreakdown').value;let data=by==='Bike type'?['Mountain','Road','Hybrid'].map(t=>`${t}: ${bikes.filter(b=>b.type===t).length} bikes / ${reservations.filter(r=>bikeById(r.bikeId)?.type===t).length} reservations`):by==='Reservation status'?['Reserved','Out','Returned','Cancelled'].map(s=>`${s}: ${reservations.filter(r=>r.status===s).length}`):['Available','Reserved','Service'].map((s,i)=>`${s}: ${bikes.filter(b=>b.status===(i===2?'service':s.toLowerCase())).length}`);document.getElementById('reportOutput').innerHTML=`<div class="notice">${esc(period)} · ${esc(by)}</div><ul style="padding-left:20px">${data.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function exportReport(){const rows=[['Bike ID','Model','Type','Size','Status','Rate'],...bikes.map(b=>[b.id,b.name,b.type,b.size,b.status,b.price])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bend-bike-shop-report.csv';a.click();URL.revokeObjectURL(url);toast('CSV report exported.')}
function permissions(){return `${hero('ADMINISTRATION','Employee permissions','Managers and owners can manage staff access. Employees can handle day-to-day bike status and handoffs.','<button class="btn secondary" onclick="go(\'dashboard\')">← Dashboard</button>')}${noticeHTML()}<div class="card pad"><div class="section-title"><h2>Employee access</h2><button class="btn primary" onclick="addEmployee()">+ Add employee</button></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Role</th><th>Permissions</th><th>Actions</th></tr></thead><tbody>${employees.map((e,i)=>`<tr><td><strong>${esc(e.name)}</strong></td><td><span class="tag">${e.role}</span></td><td>${e.role==='Owner'?'All system permissions':e.role==='Manager'?'Inventory, reports, refunds, employee management':'Bike status, pickups, returns, customer charges'}</td><td><div class="actions"><button class="btn secondary small" onclick="changeRole(${i})">Edit role</button>${e.role!=='Owner'?`<button class="btn danger small" onclick="removeEmployee(${i})">Remove</button>`:''}</div></td></tr>`).join('')}</tbody></table></div><div class="notice warn">Only managers and owners may issue refunds or manage employee accounts. Role changes are simulated for this prototype.</div></div>`}
function addEmployee(){const name=prompt('Enter employee name:');if(!name||!name.trim())return;employees.push({name:name.trim(),role:'Employee'});notice={msg:`${name.trim()} added as an employee.`,type:'ok'};render()}
function changeRole(i){if(employees[i].role==='Owner'){toast('The owner role cannot be changed in this prototype.');return}let role=prompt('Enter role: Employee, Manager, or Owner',employees[i].role);if(role===null)return;role=role.trim();if(!['Employee','Manager','Owner'].includes(role)){toast('Choose Employee, Manager, or Owner.');return}employees[i].role=role;notice={msg:`${employees[i].name}'s role updated to ${role}.`,type:'ok'};render()}
function removeEmployee(i){if(employees[i].role==='Owner'){toast('Owner account cannot be removed.');return}if(!confirm(`Remove ${employees[i].name} from employee access?`))return;let name=employees[i].name;employees.splice(i,1);notice={msg:`${name} removed from employee access.`,type:'warn'};render()}
function wireForms(){}
render();
</script>
</body></html>
